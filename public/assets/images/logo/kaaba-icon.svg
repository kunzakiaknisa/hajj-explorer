<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="kaabaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123B56"/>
      <stop offset="100%" stop-color="#0A1E2B"/>
    </linearGradient>
    <linearGradient id="goldBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F4B942"/>
      <stop offset="50%" stop-color="#FFDE82"/>
      <stop offset="100%" stop-color="#F4B942"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="#E8F5FA"/>
  <rect x="7" y="7" width="86" height="86" rx="20" fill="none" stroke="#258FBA" stroke-width="2" stroke-dasharray="4 2"/>
  
  <!-- Ka'bah Cube Isometric -->
  <!-- Roof -->
  <polygon points="50,22 75,34 50,46 25,34" fill="#1E5275"/>
  <!-- Left Face -->
  <polygon points="25,34 50,46 50,78 25,65" fill="#123B56"/>
  <!-- Right Face -->
  <polygon points="50,46 75,34 75,65 50,78" fill="#0E2D42"/>
  
  <!-- Kiswah Gold Band (Kisah Sabuk Emas) -->
  <polygon points="25,41 50,53 50,57 25,45" fill="url(#goldBand)"/>
  <polygon points="50,53 75,41 75,45 50,57" fill="url(#goldBand)"/>
  
  <!-- Kaaba Door Golden Detail -->
  <rect x="54" y="58" width="5" height="12" fill="#F4B942" rx="1"/>
  
  <!-- AR Sparkles -->
  <circle cx="20" cy="24" r="3" fill="#F4B942"/>
  <circle cx="78" cy="22" r="2.5" fill="#258FBA"/>
  <circle cx="82" cy="74" r="3" fill="#F4B942"/>
</svg>
